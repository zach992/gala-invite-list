<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Invite Lists</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="app-title">Invite Lists</div>
    </header>

    <!-- Event Tabs -->
    <div class="tabs-container" id="tabs-container"></div>

    <!-- Main Content (populated by JS) -->
    <main id="app">
        <div class="loading">Loading...</div>
    </main>

    <!-- Confirm Delete Modal -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <div class="modal-title">Delete Invitee</div>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;">
                Are you sure you want to remove <strong id="delete-name"></strong> from this event's invite list?
            </p>
            <div class="modal-actions">
                <button class="btn" onclick="App.closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" id="confirm-delete-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Event Modal -->
    <div class="modal-overlay" id="delete-event-modal">
        <div class="modal">
            <div class="modal-title">Delete Event</div>
            <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 20px;">
                Are you sure you want to delete <strong id="delete-event-name"></strong> and all its invitees?
            </p>
            <div class="modal-actions">
                <button class="btn" onclick="App.closeDeleteEventModal()">Cancel</button>
                <button class="btn btn-danger" id="confirm-delete-event-btn">Delete Event</button>
            </div>
        </div>
    </div>

    <!-- Invitee Detail Modal -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal detail-modal">
            <div class="detail-header">
                <div class="detail-photo-wrapper">
                    <img class="detail-photo" id="detail-photo" src="" alt="">
                    <div class="detail-photo-placeholder" id="detail-photo-placeholder">No Photo</div>
                </div>
                <div class="detail-info">
                    <div class="detail-name" id="detail-name"></div>
                    <div class="detail-title" id="detail-title"></div>
                </div>
                <button class="btn-icon detail-close" onclick="App.closeDetailModal()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="detail-fields">
                <label>Headshot URL</label>
                <div class="detail-url-row">
                    <input class="editable-text detail-input" id="detail-headshot-url" placeholder="https://..." oninput="App.previewHeadshot(this.value)">
                </div>
                <label>Bio</label>
                <textarea class="brief-textarea detail-bio" id="detail-bio" placeholder="3-5 sentence bio..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="App.closeDetailModal()">Cancel</button>
                <button class="btn btn-primary" onclick="App.saveDetail()">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
